name: E-commerce Quality Lab CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 22 * * *'  # Ежедневно в 22:00 (ночной регресс)

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: "nopCommerce_db_password"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P nopCommerce_db_password -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      # Шаг 1: Получить код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Установить Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Шаг 3: Запустить nopCommerce в Docker
      - name: Start nopCommerce in Docker
        run: |
          cd 02-local-mock-nopcommerce
          docker-compose up -d
          sleep 45  # Даем время для полного запуска

      # Шаг 4: Запустить UI тесты
      - name: Run UI Tests
        run: |
          cd 02-local-mock-nopcommerce/ui-automation
          mvn clean test

      # Шаг 5: Запустить API тесты (RestAssured)
      - name: Run API Tests
        run: |
          cd 02-local-mock-nopcommerce/ui-automation
          mvn test -DsuiteXmlFile=testng-api.xml

      # Шаг 6: Установить и запустить Newman (Postman CLI)
      - name: Run Postman Tests via Newman
        run: |
          # Установить Node.js (необходимо для Newman)
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          
          # Установить Newman
          npm install -g newman
          
          # Запустить Postman коллекцию
          cd 02-local-mock-nopcommerce/api-tests/postman
          newman run nopcommerce-collection.json \
            --environment nopcommerce-environment.json \
            --reporters cli,json \
            --reporter-json-export postman-results.json

      # Шаг 7: Сгенерировать Allure отчет
      - name: Generate Allure Report
        if: always()
        run: |
          cd 02-local-mock-nopcommerce/ui-automation
          mvn allure:report

      # Шаг 8: Загрузить Allure результаты (ОБНОВЛЕНО v3 -> v4)
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: 02-local-mock-nopcommerce/ui-automation/target/allure-results/
          retention-days: 30



      # Шаг 10: Загрузить Postman результаты (ОБНОВЛЕНО v3 -> v4)
      - name: Upload Postman Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-results
          path: 02-local-mock-nopcommerce/api-tests/postman/postman-results.json
          retention-days: 30

      # Шаг 11: Остановить Docker контейнеры
      - name: Stop Docker containers
        if: always()
        run: |
          cd 02-local-mock-nopcommerce
          docker-compose down