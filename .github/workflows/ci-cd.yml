name: E-commerce Quality Lab CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Получить код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Показать структуру файлов
      - name: Debug - Show directory structure
        run: |
          echo "📁 Структура репозитория:"
          pwd
          ls -la
          echo ""
          echo "🔍 Проверка наличия папок:"
          [ -d "02-local-mock-nopcommerce" ] && echo "✅ 02-local-mock-nopcommerce существует" || echo "❌ 02-local-mock-nopcommerce не найден"

      # Шаг 3: Установить Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Шаг 4: Установить Docker Compose
      - name: Setup Docker Compose
        run: |
          echo "🐳 Установка Docker Compose..."
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
          docker compose version

      # Шаг 5: Запустить nopCommerce через Docker Compose
      - name: Start nopCommerce
        run: |
          echo "🚀 Запуск nopCommerce..."
          cd 02-local-mock-nopcommerce
          
          # Используем docker compose (через пробел) вместо docker-compose
          docker compose up -d
          
          # Ждем запуск
          echo "⏳ Ожидание запуска контейнеров (30 секунд)..."
          sleep 30
          
          # Проверяем статус
          docker ps
          echo ""
          echo "🔍 Проверка доступности nopCommerce..."
          curl -f http://localhost:8080 && echo "✅ nopCommerce запущен!" || echo "⚠️ nopCommerce еще не готов"

      # Шаг 6: Запустить тесты
      - name: Run Tests
        run: |
          echo "🧪 Запуск тестов..."
          cd 02-local-mock-nopcommerce/ui-automation
          mvn clean test

      # Шаг 7: Остановить контейнеры
      - name: Stop containers
        if: always()
        run: |
          echo "🛑 Остановка контейнеров..."
          cd 02-local-mock-nopcommerce
          docker compose down