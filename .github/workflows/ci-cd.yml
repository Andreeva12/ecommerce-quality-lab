name: E-commerce Quality Lab CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Fix docker-compose.yml if needed
        run: |
          echo "🔧 Проверка docker-compose.yml..."
          cd 02-local-mock-nopcommerce
          
          # Если есть build: . но нет Dockerfile, исправляем
          if grep -q "build: \." docker-compose.yml && [ ! -f "Dockerfile" ]; then
            echo "⚠️ Обнаружен build: . но нет Dockerfile. Исправляем..."
            # Заменяем build: . на image: nopcommerce/nopcommerce:latest
            sed -i 's|build: \.|image: nopcommerce/nopcommerce:latest|g' docker-compose.yml
            echo "✅ docker-compose.yml исправлен"
          fi
          
          # Удаляем устаревшую версию чтобы избежать предупреждения
          sed -i '/^version:/d' docker-compose.yml || true

      - name: Start nopCommerce
        run: |
          cd 02-local-mock-nopcommerce
          
          # Проверяем содержимое docker-compose.yml
          echo "📋 Содержимое docker-compose.yml:"
          cat docker-compose.yml
          echo ""
          
          # Запускаем контейнеры
          echo "🚀 Запуск контейнеров..."
          docker-compose up -d
          
          # Ждем запуск
          echo "⏳ Ожидание запуска контейнеров (90 секунд)..."
          sleep 90
          
          # Проверяем статус
          echo "📊 Статус контейнеров:"
          docker ps
          
          # Проверяем логи если что-то пошло не так
          echo "📋 Логи nopCommerce:"
          docker logs nopcommerce --tail 20 2>/dev/null || echo "Контейнер nopcommerce не запущен"
          
          echo "🔍 Проверка доступности..."
          curl -f http://localhost:8080 && echo "✅ nopCommerce доступен!" || echo "❌ nopCommerce не доступен"

      - name: Run Tests
        run: |
          cd 02-local-mock-nopcommerce/ui-automation
          mvn clean test

      - name: Stop containers
        if: always()
        run: |
          cd 02-local-mock-nopcommerce
          docker-compose down