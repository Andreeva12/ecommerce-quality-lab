name: E-commerce Quality Lab CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Получить код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Показать структуру файлов
      - name: Debug - Show directory structure
        run: |
          echo "📁 Структура репозитория:"
          pwd
          ls -la
          echo ""
          echo "🔍 Проверка наличия папок:"
          [ -d "02-local-mock-nopcommerce" ] && echo "✅ 02-local-mock-nopcommerce существует" || echo "❌ 02-local-mock-nopcommerce не найден"
          [ -f "02-local-mock-nopcommerce/docker-compose.yml" ] && echo "✅ docker-compose.yml существует" || echo "❌ docker-compose.yml не найден"

      # Шаг 3: Установить Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Шаг 4: Запустить Docker Compose с nopCommerce
      - name: Start nopCommerce and MSSQL
        run: |
          echo "🐳 Запуск Docker контейнеров..."
          
          # Переходим в папку с docker-compose
          cd 02-local-mock-nopcommerce
          
          # Запускаем контейнеры
          docker-compose up -d
          
          # Ждем запуск
          echo "⏳ Ожидание запуска контейнеров (60 секунд)..."
          sleep 60
          
          # Проверяем статус
          docker ps
          echo ""
          echo "🔍 Проверка доступности nopCommerce..."
          curl -I http://localhost:8080 || echo "nopCommerce еще не готов"

      # Шаг 5: Запустить тесты
      - name: Run UI Tests
        run: |
          echo "🧪 Запуск тестов..."
          
          # Переходим в папку с тестами
          cd 02-local-mock-nopcommerce/ui-automation
          
          # Запускаем тесты
          mvn clean test

      # Шаг 6: Остановить Docker контейнеры
      - name: Stop Docker containers
        if: always()
        run: |
          echo "🛑 Остановка контейнеров..."
          cd 02-local-mock-nopcommerce
          docker-compose down