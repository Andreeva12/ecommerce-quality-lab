name: E-commerce Quality Lab CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: "StrongPassword!123"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P StrongPassword!123 -Q 'SELECT 1'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug workspace structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents:"
          ls -la
          echo "Looking for 02-local-mock-nopcommerce:"
          ls -la 02-local-mock-nopcommerce || echo "Not found"
          echo "Looking for ecommerce-quality-lab:"
          ls -la ecommerce-quality-lab || echo "Not found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start nopCommerce in Docker
        run: |
          cd 02-local-mock-nopcommerce
          docker-compose up -d
          sleep 60
          docker-compose ps
          docker logs nopcommerce_web || true
          docker logs nopcommerce_mssql || true
          docker exec nopcommerce_mssql /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "StrongPassword!123" -Q "SELECT @@VERSION" || echo "SQL Server not ready"

      - name: Run UI Tests
        run: |
          cd 02-local-mock-nopcommerce/ui-automation
          mvn clean test

      - name: Run API Tests (RestAssured)
        run: |
          cd 02-local-mock-nopcommerce/ui-automation
          mvn test -DsuiteXmlFile=testng-api.xml

      - name: Run Postman Tests via Newman
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm install -g newman
          cd 02-local-mock-nopcommerce/api-tests/postman
          newman run nopcommerce-collection.json \
            --environment nopcommerce-environment.json \
            --reporters cli,json \
            --reporter-json-export postman-results.json

      - name: Generate Allure Report
        if: always()
        run: |
          cd 02-local-mock-nopcommerce/ui-automation
          mvn allure:report

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./02-local-mock-nopcommerce/ui-automation/target/allure-report
          destination_dir: allure-report
          keep_files: false
          publish_branch: gh-pages

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: 02-local-mock-nopcommerce/ui-automation/target/allure-results/
          retention-days: 30

      - name: Upload Postman Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-results
          path: 02-local-mock-nopcommerce/api-tests/postman/postman-results.json
          retention-days: 30

      - name: Stop Docker containers
        if: always()
        run: |
          cd 02-local-mock-nopcommerce
          docker-compose down
          
